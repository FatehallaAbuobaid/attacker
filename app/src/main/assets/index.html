<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Life Organizer</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1b19;--muted:#6b6a66;--line:#e6e3dc;--accent:#0f766e;--accent-ink:#fff;--accent-soft:#d9efec;--red:#b42318;--red-soft:#fde2e1;--green:#15803d;--amber:#b45309;--radius:14px}
@media (prefers-color-scheme:dark){:root{--bg:#121413;--card:#1c1f1e;--ink:#ecebe7;--muted:#9a9993;--line:#2c302e;--accent:#2dd4bf;--accent-ink:#062b27;--accent-soft:#163a36;--red:#f87171;--red-soft:#3b1d1d;--green:#4ade80;--amber:#fbbf24}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between;max-width:720px;margin:0 auto}
header h1{font-size:21px;margin:0}
main{padding:0 14px 110px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--muted);font-size:10.5px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
nav button .i{font-size:19px;line-height:1;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--accent);font-weight:600}
nav button.on .i{filter:none;opacity:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:9px;min-width:0}
.stat b{display:block;font-size:15px;word-break:break-word}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 14px;font:600 14px/1.2 inherit;cursor:pointer}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{background:none;color:var(--red);border:1px solid var(--line)}
.icon-btn{background:none;border:0;color:var(--ink);font-size:24px;padding:2px 10px;cursor:pointer}
.bar{position:relative;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--red)}
.bar .mk{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.55}
.list .item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.item .grow{flex:1;min-width:0;cursor:pointer}
.item .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.red{background:var(--red-soft);color:var(--red)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font:13px inherit;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chk{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.chk button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:18px;color:var(--accent-ink);cursor:pointer;flex-shrink:0}
.chk button.on{background:var(--accent);border-color:var(--accent)}
.dots{display:grid;grid-template-columns:64px repeat(7,1fr);gap:6px 4px;font-size:12px;align-items:center;text-align:center}
.dot{width:16px;height:16px;border-radius:5px;background:var(--line);margin:auto}
.dot.on{background:var(--accent)}
.mini{display:flex;gap:3px;margin-top:5px}
.mini i{width:9px;height:9px;border-radius:3px;background:var(--line)}
.mini i.on{background:var(--accent)}
.amt-in{color:var(--green)}.amt-out{color:var(--red)}
.empty{color:var(--muted);text-align:center;padding:12px 0;font-size:14px}
.big{font-size:24px;font-weight:700}
.score{font-size:38px;font-weight:800;line-height:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 6px}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:70px;resize:vertical}
a{color:var(--accent)}
.toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13.5px;z-index:30;max-width:90vw;text-align:center}
/* advisor */
.ins{border-left:4px solid var(--muted);padding:8px 10px;margin:8px 0;background:var(--bg);border-radius:8px;font-size:13.5px}
.ins.good{border-color:var(--green)}.ins.warn{border-color:var(--amber)}.ins.bad{border-color:var(--red)}
.trend{display:flex;align-items:flex-end;gap:6px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.trend .bars{display:flex;gap:3px;align-items:flex-end;height:90px;width:100%;justify-content:center}
.trend .bars i{width:38%;border-radius:4px 4px 0 0;display:block;min-height:2px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{position:relative;height:52px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:3px 2px;overflow:hidden;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer}
.cell .heat{position:absolute;inset:0;background:var(--accent);pointer-events:none}
.cell .dn,.cell .cd,.cell .md{position:relative}
.cell .dn{font-size:12.5px;font-weight:600}
.cell .md{font-size:12px;line-height:1}
.cell .cd{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:5px}
.cell .cd i{width:5px;height:5px;border-radius:50%}
.cell.today{border:2px solid var(--accent)}
.cell.future{opacity:.45}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px}
.legend i,.hi i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.hi{display:flex;align-items:center;gap:6px;padding:5px 0;font-size:14px}
.hi .grow{flex:1;min-width:0}
.hgrp{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 0}
/* mood */
.mood{display:flex;justify-content:space-between;gap:4px}
.mood button{flex:1;font-size:26px;background:none;border:2px solid transparent;border-radius:12px;padding:4px 0;filter:grayscale(.85);opacity:.55;cursor:pointer}
.mood button.on{border-color:var(--accent);filter:none;opacity:1;background:var(--accent-soft)}
.timerbar{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:99px;z-index:7;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer;white-space:nowrap;max-width:90vw;overflow:hidden}
</style>
</head>
<body>
<header><h1 id="title">Life Organizer</h1><button class="icon-btn" onclick="openSettings()" aria-label="Settings" style="font-size:20px">⚙️</button></header>
<main id="view"></main>
<nav>
  <button data-v="home" onclick="go('home')"><span class="i">🏠</span>Home</button>
  <button data-v="cal" onclick="go('cal')"><span class="i">📅</span>Calendar</button>
  <button data-v="money" onclick="go('money')"><span class="i">💰</span>Money</button>
  <button data-v="books" onclick="go('books')"><span class="i">📚</span>Reading</button>
  <button data-v="learn" onclick="go('learn')"><span class="i">🎓</span>Learning</button>
  <button data-v="deen" onclick="go('deen')"><span class="i">🕌</span>Deen</button>
  <button data-v="plan" onclick="go('plan')"><span class="i">✅</span>Plan</button>
</nav>
<script>
/* ---------- data ---------- */
const KEY = 'lifeos.v1';   // same key as v1, so existing data carries over
const DEF = {
  settings:{currency:'JOD', name:'', khatmaStart:null, zSavings:0, zGold:0, weekStart:6, efMonths:6,
    notif:{on:false, lang:'ar', morning:'08:00', evening:'21:30', quit:true, focus:true, money:true}},
  tx:[], books:[], courses:[], deen:{}, habits:[], tasks:[],
  budgets:{}, goals:[], recurring:[], debts:[],
  events:[], journal:{}, inbox:[], focus:{}, timer:null, quits:[]
};
const clone = o => JSON.parse(JSON.stringify(o));
function normalize(d){
  const s = clone(DEF), ds = (d && d.settings) || {};
  for (const k of Object.keys(DEF)) if (d && d[k] !== undefined && d[k] !== null) s[k] = d[k];
  s.settings = Object.assign(clone(DEF.settings), ds);
  s.settings.notif = Object.assign(clone(DEF.settings.notif), ds.notif || {});
  for (const q of s.quits){ q.slips = q.slips || []; q.urges = q.urges || {}; q.clean = q.clean || {}; }
  return s;
}
function load(){ try { const r = localStorage.getItem(KEY); if (r) return normalize(JSON.parse(r)); } catch(e){} return clone(DEF); }
let syncT = null;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('Could not save on this device'); }
  clearTimeout(syncT); syncT = setTimeout(syncNotifs, 1200);   // keep notification texts in step with your data
}
let S = load();

const PR = [['fajr','Fajr'],['dhuhr','Dhuhr'],['asr','Asr'],['maghrib','Maghrib'],['isha','Isha']];
const EXTRAS = [['am','Morning adhkar'],['pm','Evening adhkar'],['duha','Duha'],['witr','Witr'],['fast','Fasting'],['sadaqah','Sadaqah']];
const EXP_CATS = ['Food','Groceries','Transport','Bills','Rent','Shopping','Health','Education','Entertainment','Subscriptions','Personal care','Family','Gifts','Charity','Debt payment','Other'];
const INC_CATS = ['Salary','Bonus','Freelance','Side project','Investment','Gift','Other'];
const NEEDS = new Set(['Groceries','Transport','Bills','Rent','Health','Education','Family','Debt payment']);
const GIVING = new Set(['Charity']);
const bucket = c => NEEDS.has(c) ? 'needs' : GIVING.has(c) ? 'giving' : 'wants';
const QURAN_PAGES = 604;
const MOODS = ['😞','😕','😐','🙂','😄'], MOOD_L = ['Low','Down','Okay','Good','Great'];
const CAT = {deen:['Deen','#0d9488'], money:['Money','#d97706'], habit:['Habits','#7c3aed'], task:['Tasks','#2563eb'], book:['Reading','#db2777'], learn:['Learning','#0891b2'], focus:['Focus','#65a30d'], quit:['Break habits','#e11d48'], mood:['Mood','#eab308']};
const MILES = [1,3,7,14,21,30,60,90,180,365,730];
const TRIGGERS = ['Boredom','Stress','Tired','Alone','Phone / social media','People around me','Time of day / routine','Sad or upset','Celebrating','Other'];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const ym = d => ymd(d).slice(0,7);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const r2 = n => Math.round((n||0)*100)/100;
function addDays(s,n){ const d = new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return ymd(d); }
function shiftMonth(m,n){ const [y,mo] = m.split('-').map(Number); return ym(new Date(y, mo-1+n, 1)); }
function dim(m){ const [y,mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); }
const isCur = m => m === ym(new Date());
function monthLabel(m){ const [y,mo] = m.split('-').map(Number); return new Date(y, mo-1, 1).toLocaleDateString(undefined,{month:'long',year:'numeric'}); }
function dayLabel(s){ return new Date(s+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}); }
function weekStartOf(s){ const d = new Date(s+'T12:00:00'); return addDays(s, -((d.getDay() - S.settings.weekStart + 7) % 7)); }
function num(n){ return r2(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function money(n){ return num(n) + ' ' + esc(S.settings.currency); }      // for HTML
function moneyTxt(n){ return num(n) + ' ' + S.settings.currency; }        // for text that gets escaped later
const pct = n => Math.round(n) + '%';
const fmtMin = n => n >= 60 ? `${Math.floor(n/60)}h ${n%60}m` : `${n}m`;
function stat(l,v,cls=''){ return `<div class="stat"><span class="muted small">${l}</span><b class="${cls}">${v}</b></div>`; }
function tabsHtml(tabs,cur,key){ return `<div class="tabs">${tabs.map(([k,l]) => `<button class="${k===cur?'on':''}" onclick="ui.${key}='${k}';render()">${l}</button>`).join('')}</div>`; }
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2400); }
const safeUrl = u => /^https?:\/\//i.test(u||'') ? u : '';
function sure(btn, fn){ if (btn.dataset.sure){ fn(); } else { btn.dataset.sure = 1; btn.textContent = 'Tap to confirm'; } }
function logEvent(type, text, extra){ S.events.push({id: uid(), date: today(), ts: Date.now(), type, text, ...(extra||{})}); }

/* ---------- modal + form ---------- */
let openModal = null;
function modal(html){
  closeModal();
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m) closeModal(); });
  document.body.appendChild(m); openModal = m; return m;
}
function closeModal(){ if (openModal){ openModal.remove(); openModal = null; } }
function refreshDay(){ if (openModal && openModal.dataset.day) openDay(openModal.dataset.day); }
function field(f,v){
  const id = 'f_'+f.k; v = v ?? '';
  const lab = `<label for="${id}">${esc(f.label)}</label>`;
  if (f.type === 'select') return lab + `<select id="${id}" name="${f.k}">${f.options.map(o => { const [val,l] = Array.isArray(o)?o:[o,o]; return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(l)}</option>`; }).join('')}</select>`;
  if (f.type === 'textarea') return lab + `<textarea id="${id}" name="${f.k}">${esc(v)}</textarea>`;
  const numA = f.type === 'number' ? 'inputmode="decimal" step="any" min="0"' : '';
  return lab + `<input id="${id}" name="${f.k}" type="${f.type||'text'}" ${numA} value="${esc(v)}" ${f.req?'required':''}>`;
}
function form(title, fields, init, onSave, onDelete){
  init = init || {};
  const m = modal(`<h3>${esc(title)}</h3><form>${fields.map(f => field(f, init[f.k])).join('')}
    <div class="row" style="margin-top:16px"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" data-x>Cancel</button><span style="flex:1"></span>${onDelete?'<button class="btn danger" type="button" data-del>Delete</button>':''}</div></form>`);
  const fm = m.querySelector('form');
  m.querySelector('[data-x]').onclick = closeModal;
  if (onDelete){ const b = m.querySelector('[data-del]'); b.onclick = () => { if (b.dataset.sure){ onDelete(); save(); closeModal(); render(); } else { b.dataset.sure = 1; b.textContent = 'Tap to confirm'; } }; }
  fm.onsubmit = e => {
    e.preventDefault(); const v = {};
    for (const f of fields){ let x = fm.elements[f.k].value.trim(); if (f.type==='number' || f.num) x = x==='' ? null : Number(x); v[f.k] = x; }
    if (onSave(v) === false) return;
    save(); closeModal(); render();
  };
}
function shareOrDownload(text, filename, mime){
  if (window.AndroidBridge && AndroidBridge.shareText){ AndroidBridge.shareText(text); return; }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type: mime}));
    a.download = filename; document.body.appendChild(a); a.click(); a.remove(); toast('Downloaded');
  } catch(e){ if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard')); }
}

/* ---------- navigation ---------- */
let view = 'home';
const ui = {month: ym(new Date()), bookTab:'reading', courseTab:'active', deenDate: today(), showDone:false,
  moneyTab:'overview', txType:'all', txq:'', calMonth: ym(new Date()), calMode:'cal', calFilter:'all', histLimit:30, planTab:'build', qMonth:null};
const TITLES = {home:'Life Organizer', cal:'Calendar & History', money:'Money', books:'Reading', learn:'Learning', deen:'Deen', plan:'Plan & Focus'};
function go(v, keep){ view = v; if (v==='deen' && !keep) ui.deenDate = today(); render(); window.scrollTo(0,0); }
function render(){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('#title').textContent = TITLES[view];
  $('#view').innerHTML = VIEWS[view]();
  timerBar();
}
window.handleBack = function(){ if (openModal){ closeModal(); return true; } if (view !== 'home'){ go('home'); return true; } return false; };

/* ---------- tracking index: everything you did, by day ---------- */
function buildIndex(){
  const idx = {}; const add = (d,it) => { if (d) (idx[d] = idx[d] || []).push(it); };
  for (const [d,r] of Object.entries(S.deen)){
    const p = PR.filter(x => r[x[0]]);
    if (p.length) add(d, {c:'deen', t:`Prayers ${p.length}/5` + (p.length===5 ? ' ✓' : ` (${p.map(x=>x[1]).join(', ')})`), w:p.length});
    if (r.quran > 0) add(d, {c:'deen', t:`Quran · ${r.quran} pages`, w:1});
    const ex = EXTRAS.filter(x => r[x[0]]).map(x => x[1]);
    if (ex.length) add(d, {c:'deen', t:ex.join(', '), w:ex.length});
  }
  for (const h of S.habits) for (const d of Object.keys(h.log||{})) add(d, {c:'habit', t:h.name, w:1});
  for (const x of S.tasks){
    if (x.done && x.doneAt) add(x.doneAt, {c:'task', t:'Done · '+x.title, w:1});
    else if (!x.done && x.due) add(x.due, {c:'task', t:'Due · '+x.title, w:0});
  }
  for (const x of S.tx) add(x.date, {c:'money', t:(x.note || x.cat) + (x.note ? ` · ${x.cat}` : ''), amt: x.type==='income' ? x.amount : -x.amount, w:1});
  for (const b of S.books){
    if (b.started) add(b.started, {c:'book', t:'Started · '+b.title, w:1});
    if (b.status==='done' && b.finished) add(b.finished, {c:'book', t:'Finished · '+b.title, w:2});
  }
  for (const c of S.courses) if (c.status==='done' && c.finished) add(c.finished, {c:'learn', t:'Completed · '+c.title, w:2});
  for (const e of S.events) add(e.date, {c:e.type, t:e.text, w:1});
  for (const q of S.quits){
    for (const d of Object.keys(q.clean)) add(d, {c:'quit', t:'Clean ✓ · '+q.name, w:1});
    for (const [d,n] of Object.entries(q.urges)) add(d, {c:'quit', t:`Resisted ${n} urge${n>1?'s':''} · ${q.name}`, w:1});
    for (const s of q.slips) add(s.date, {c:'quit', t:'Slipped · '+q.name + (s.trigger ? ` (${s.trigger})` : ''), w:0});
    const n = qStreak(q); if (MILES.includes(n)) add(today(), {c:'quit', t:`🏅 ${n} days clean · ${q.name}`, w:0});
  }
  for (const [d,j] of Object.entries(S.journal)) if (j && (j.mood || j.note)) add(d, {c:'mood', t:(j.mood ? MOODS[j.mood-1]+' '+MOOD_L[j.mood-1] : 'Note') + (j.note ? ' · ' + j.note : ''), w:0});
  return idx;
}
function rangeStats(from, to, idx){
  idx = idx || buildIndex();
  const s = {days:0, active:0, pr:0, pdays:0, hab:0, spent:0, inc:0, quran:0, pages:0, lessons:0, focus:0, tasks:0, moodSum:0, moodN:0};
  const firstDeen = Object.keys(S.deen).filter(d => PR.some(p => S.deen[d][p[0]])).sort()[0];
  for (let d = from; d <= to; d = addDays(d,1)){
    s.days++;
    if ((idx[d]||[]).some(x => x.w > 0)) s.active++;
    const r = S.deen[d] || {};
    if (firstDeen && d >= firstDeen) s.pdays++;
    s.pr += PR.filter(p => r[p[0]]).length; s.quran += r.quran || 0;
    const j = S.journal[d]; if (j && j.mood){ s.moodSum += j.mood; s.moodN++; }
  }
  for (const h of S.habits) for (const d in (h.log||{})) if (d >= from && d <= to) s.hab++;
  for (const x of S.tx) if (x.date >= from && x.date <= to){ if (x.type==='income') s.inc += x.amount; else s.spent += x.amount; }
  for (const e of S.events) if (e.date >= from && e.date <= to){ if (e.type==='book') s.pages += e.n||0; else if (e.type==='learn') s.lessons += e.n||0; else if (e.type==='focus') s.focus += e.n||0; }
  for (const x of S.tasks) if (x.done && x.doneAt >= from && x.doneAt <= to) s.tasks++;

  s.habPct = S.habits.length ? s.hab/(S.habits.length*s.days)*100 : null;
  return s;
}

/* ---------- money: numbers ---------- */
function monthTotals(m){
  let inc = 0, exp = 0; const cats = {}, b = {needs:0, wants:0, giving:0};
  for (const x of S.tx){ if (!x.date || !x.date.startsWith(m)) continue;
    if (x.type === 'income') inc += x.amount; else { exp += x.amount; cats[x.cat] = (cats[x.cat]||0) + x.amount; b[bucket(x.cat)] += x.amount; } }
  return {inc, exp, cats, b};
}
function avgOf(fn, n=3, base=ym(new Date())){
  let tot = 0, c = 0;
  for (let i = 1; i <= n; i++){ const t = monthTotals(shiftMonth(base,-i)); if (t.exp || t.inc){ tot += fn(t); c++; } }
  return c ? tot/c : 0;
}
const avgExp = (n,base) => avgOf(t => t.exp, n, base);
const avgInc = (n,base) => avgOf(t => t.inc, n, base);
const avgCat = (cat,n,base) => avgOf(t => t.cats[cat]||0, n, base);
const totalBudget = () => Object.values(S.budgets).reduce((a,b) => a + (+b||0), 0);
const efGoal = () => S.goals.find(g => g.kind === 'emergency');
const isLogged = (r,m) => S.tx.some(t => t.rid === r.id && t.date && t.date.startsWith(m));
const pendingFixed = m => S.recurring.filter(r => r.type !== 'income' && !isLogged(r,m)).reduce((s,r) => s + (+r.amount||0), 0);
const debtMonthly = () => S.debts.filter(d => d.dir !== 'owed' && d.remaining > 0).reduce((s,d) => s + (+d.monthly||0), 0);
function safePerDay(){
  const m = ym(new Date()), t = monthTotals(m), cap = totalBudget() || t.inc;
  if (!cap) return null;
  const daysLeft = dim(m) - new Date().getDate() + 1;
  return (cap - t.exp - pendingFixed(m)) / daysLeft;
}
function goalMonthly(g){
  if (!g.deadline) return 0; const left = (g.target||0) - (g.saved||0); if (left <= 0) return 0;
  const now = new Date(), dl = new Date(g.deadline+'T12:00:00');
  return left / Math.max(1, (dl.getFullYear()-now.getFullYear())*12 + dl.getMonth() - now.getMonth());
}
function health(m){
  const t = monthTotals(m); if (!t.inc) return null;
  const sr = (t.inc-t.exp)/t.inc*100; let s = clamp(sr/20, 0, 1) * 30;
  const bs = Object.entries(S.budgets).filter(([,b]) => b > 0);
  s += bs.length ? 20 * (1 - bs.filter(([c,b]) => (t.cats[c]||0) > b).length / bs.length) : 10;
  const ef = efGoal(), base = avgExp(3,m) || t.exp;
  s += ef && base ? clamp((ef.saved||0)/base/S.settings.efMonths, 0, 1) * 25 : 0;
  const r = debtMonthly() / t.inc; s += r <= 0.2 ? 15 : clamp(1-(r-0.2)/0.2, 0, 1) * 15;
  const nd = t.b.needs/t.inc*100; s += nd <= 50 ? 10 : clamp(1-(nd-50)/30, 0, 1) * 10;
  return Math.round(s);
}
function advisor(m){
  const t = monthTotals(m), cur = isCur(m), out = [], C = S.settings.efMonths;
  const a3 = avgExp(3,m), refInc = t.inc || avgInc(3,m), budget = totalBudget();
  const D = dim(m), day = cur ? new Date().getDate() : D, pend = pendingFixed(m);
  if (!t.inc) out.push(['info', 'No income logged for this month yet. Add it so the savings rate and the 50/30/20 check can work.']);
  else {
    const sr = (t.inc-t.exp)/t.inc*100;
    if (sr >= 20) out.push(['good', `You are keeping ${pct(sr)} of your income. That meets the common 20% savings target.`]);
    else if (sr >= 10) out.push(['warn', `You are keeping ${pct(sr)} of your income. To reach 20% you would need to spend about ${moneyTxt(t.inc*0.2-(t.inc-t.exp))} less.`]);
    else if (sr >= 0) out.push(['bad', `Only ${pct(sr)} of your income is left. Cut "wants" first: eating out, shopping, entertainment, subscriptions.`]);
    else out.push(['bad', `You spent ${moneyTxt(t.exp-t.inc)} more than you earned this month.`]);
  }
  if (cur && day >= 5 && t.exp > 0){
    const proj = t.exp/day*D, cap = budget || refInc;
    if (cap && proj > cap*1.02) out.push(['warn', `At this pace you will spend about ${moneyTxt(proj)} this month, more than your ${budget ? 'budget' : 'income'} of ${moneyTxt(cap)}.`]);
  }
  if (cur){
    const sp = safePerDay();
    if (sp !== null) out.push(sp > 0 ? ['info', `Safe to spend: about ${moneyTxt(sp)} per day until the end of the month${pend ? ` (after ${moneyTxt(pend)} of fixed costs still to pay)` : ''}.`]
                                      : ['bad', `Your ${budget ? 'budget' : 'income'} for this month is already used up${pend ? ' and fixed costs are still due' : ''}.`]);
  }
  const over = [], near = [];
  for (const [c,b] of Object.entries(S.budgets)){ if (!(b > 0)) continue; const s = t.cats[c]||0; if (s > b) over.push(`${c} (${pct(s/b*100)})`); else if (s >= b*0.8) near.push(c); }
  if (over.length) out.push(['bad', `Over budget: ${over.join(', ')}.`]);
  if (near.length) out.push(['warn', `Close to the limit: ${near.join(', ')}.`]);
  if (!budget && t.exp > 0) out.push(['info', 'No budgets yet. Open the Budget tab and tap "Suggest from my history" to create them in one step.']);
  for (const [c,s] of Object.entries(t.cats)){ const av = avgCat(c,3,m); if (av > 0 && s > av*1.3 && s-av >= Math.max(5, a3*0.03)) out.push(['warn', `${c} is ${pct((s/av-1)*100)} higher than your 3-month average of ${moneyTxt(av)}.`]); }
  if (t.inc){
    const nd = t.b.needs/t.inc*100, wt = t.b.wants/t.inc*100;
    if (nd > 50) out.push(['warn', `Needs take ${pct(nd)} of your income (guide: 50%). Rent, bills and transport are where the big savings usually are.`]);
    if (wt > 30) out.push(['warn', `Wants take ${pct(wt)} of your income (guide: 30%).`]);
  }
  const ef = efGoal(), base = a3 || t.exp;
  if (!ef) out.push(['info', `No emergency fund yet. A common target is ${C} months of expenses${base ? ` (about ${moneyTxt(base*C)} for you)` : ''}. Set it up in Goals.`]);
  else if (base){ const mo = (ef.saved||0)/base; out.push([mo >= C ? 'good' : mo >= 3 ? 'warn' : 'bad', `Your emergency fund covers ${mo.toFixed(1)} months of expenses (target: ${C}).`]); }
  const dm = debtMonthly();
  if (dm && refInc){ const r = dm/refInc*100;
    if (r > 36) out.push(['bad', `Debt payments take ${pct(r)} of income. Above 36% is high: avoid new debt and pay off the most expensive one first.`]);
    else if (r > 20) out.push(['warn', `Debt payments take ${pct(r)} of income. Under 20% is the healthy range.`]); }
  const fixed = S.recurring.filter(r => r.type !== 'income').reduce((s,r) => s + (+r.amount||0), 0);
  if (fixed && refInc && fixed/refInc > 0.5) out.push(['warn', `Fixed monthly costs are ${pct(fixed/refInc*100)} of income, which leaves little room to save.`]);
  for (const g of S.goals){
    if (g.kind === 'emergency' || !g.deadline || (g.saved||0) >= g.target) continue;
    const need = goalMonthly(g);
    if (need && t.inc && t.inc - t.exp < need) out.push(['warn', `To reach "${g.name}" on time you need to save ${moneyTxt(need)} a month. This month you have ${moneyTxt(Math.max(0,t.inc-t.exp))} left.`]);
  }
  if (S.settings.zGold && S.settings.zSavings >= S.settings.zGold*85) out.push(['info', `Your savings are above the nisab: zakat of about ${moneyTxt(S.settings.zSavings*0.025)} is due once a lunar year has passed.`]);
  if (t.exp && !out.some(x => x[0]==='bad' || x[0]==='warn')) out.push(['good', 'No warning signs this month. Keep it up.']);
  return out;
}

function bestStreak(h){ const ds = Object.keys(h.log).sort(); let best = 0, cur = 0, prev = null; for (const d of ds){ cur = prev && addDays(prev,1) === d ? cur+1 : 1; best = Math.max(best, cur); prev = d; } return best; }

/* ---------- break bad habits ---------- */
function daysBetween(a,b){ return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00')) / 864e5); }
function qStreak(q, at){ at = at || today(); const s = q.slips.map(x => x.date).filter(d => d <= at).sort(); const from = s.length ? s[s.length-1] : q.start; return Math.max(0, daysBetween(from > at ? at : from, at)); }
function qBest(q){ const pts = [q.start, ...q.slips.map(x => x.date).filter(d => d >= q.start).sort(), today()]; let b = 0; for (let i = 1; i < pts.length; i++) b = Math.max(b, daysBetween(pts[i-1], pts[i])); return b; }
function qCleanDays(q){ return Math.max(0, daysBetween(q.start, today()) + 1 - new Set(q.slips.map(x => x.date)).size); }
const qUrgeTotal = q => Object.values(q.urges).reduce((a,b) => a + b, 0);
const nextMile = n => MILES.find(m => m > n) || n + 365;
function qStatus(q, d){
  if (d < q.start || d > today()) return 'none';
  if (q.slips.some(s => s.date === d)) return 'slip';
  if (q.urges[d]) return 'urge';
  return q.clean[d] ? 'clean' : 'implied';
}
const Q_COL = {slip:'var(--red)', urge:'var(--amber)', clean:'var(--green)', implied:'var(--green)', none:'var(--line)'};
function quitWeek(q){
  const days = [...Array(14)].map((_,i) => addDays(today(), i-13));
  return `<div class="mini">${days.map(d => { const s = qStatus(q,d); return `<i style="background:${Q_COL[s]};opacity:${s==='implied'?.35:1}" title="${d}"></i>`; }).join('')}</div>`;
}
function vQuit(){

    <p class="small muted" style="margin:0">Every day without it counts. Log urges you beat, and if you slip, log it honestly and keep going. The streak restarts, your progress does not.</p></div>
  ${S.quits.map(quitCard).join('') || '<div class="card empty">Phone scrolling, smoking, junk food, staying up late… add the habit you want to stop.</div>'}`;

function quitCard(q){

  <div class="row" style="gap:14px"><span class="score" style="color:var(--green)">${n}</span><div><b>${n === 1 ? 'day' : 'days'} clean</b><div class="small muted">Best ${qBest(q)} · ${qUrgeTotal(q)} urges beaten · next goal ${nm} days</div></div></div>

function qSlip(id, date){
  const q = S.quits.find(x => x.id === id), now = new Date();
  form('It happens. Log it and start again.', [
    {k:'date', label:'Date', type:'date', req:1}, {k:'time', label:'Time (helps find your risky hours)', type:'time'},

  ], {date: date || today(), time: date ? '' : `${pad(now.getHours())}:${pad(now.getMinutes())}`}, v => {

function qInsights(q){
  const out = [], sl = q.slips.filter(s => s.date >= q.start);
  const top = (arr) => { const c = {}; arr.forEach(x => { if (x) c[x] = (c[x]||0) + 1; }); return Object.entries(c).sort((a,b) => b[1]-a[1])[0]; };
  const tr = top(sl.map(s => s.trigger));
  if (tr && tr[1] >= 2) out.push(`Most slips come from <b>${esc(tr[0])}</b> (${tr[1]} times). Plan ahead for it.`);
  const part = h => h < 5 ? 'late night' : h < 12 ? 'morning' : h < 17 ? 'afternoon' : h < 21 ? 'evening' : 'night';
  const pt = top(sl.filter(s => s.time).map(s => part(+s.time.slice(0,2))));

function buildSchedule(){
  const N = S.settings.notif, P = L(), out = [], now = Date.now(), t = today();
  const at = (d,hm) => { const [h,mi] = String(hm||'08:00').split(':').map(Number); const x = new Date(d+'T00:00:00'); x.setHours(h||0, mi||0, 0, 0); return x.getTime(); };
  const push = (d,hm,title,text,tab) => { const ms = at(d,hm); if (ms > now + 30000) out.push({at: ms, title, text, tab}); };
  const moods = Object.entries(S.journal).filter(([d,j]) => j && j.mood && d > addDays(t,-4)).map(([,j]) => j.mood);
  const low = moods.length && moods.reduce((a,b) => a+b, 0)/moods.length <= 2.2;
  const recentSlip = S.quits.some(q => q.slips.some(s => s.date >= addDays(t,-2)));
  const focusTxt = S.focus && S.focus.text && S.focus.week === weekStartOf(t) && !S.focus.done ? S.focus.text : '';
  const course = (S.courses.find(c => c.status === 'active') || {}).title || '';
  const quits = N.quit ? S.quits : [];
  for (let k = 0; k < 14; k++){
    const d = addDays(t,k);
    // morning: milestone > streak > weekly focus > general (gentler when mood has been low)
    let title = pickL(P.mT, d), body, tab = 'home';
    const miles = quits.map(q => ({q, n: qStreak(q) + k})).filter(x => MILES.includes(x.n));
    if (miles.length){ title = fill(P.mileT, {n: miles[0].n}); body = fill(pickL(P.mile, d), {n: miles[0].n, name: miles[0].q.name}); tab = 'quit'; }
    else if (quits.length){ const q = quits[k % quits.length]; body = fill(pickL(recentSlip && k < 2 ? P.slip : low && k < 3 ? P.low : P.streak, d+q.id), {n: qStreak(q)+k, name: q.name}); tab = 'quit'; }
    else if (focusTxt && d < addDays(weekStartOf(t),7)) body = fill(pickL(P.focus, d), {x: focusTxt});
    else body = pickL(low && k < 3 ? P.low : P.gen, d);
    push(d, N.morning, title, body, tab);
    // before each quit's risky time (set by you, or learned from your slips)
    for (const q of quits){ const rt = q.riskTime || autoRisk(q); if (rt) push(d, rt, fill(P.riskT, {name: q.name}), q.why ? fill(P.riskWhy, {why: q.why}) : pickL(P.urge, d+q.id), 'quit'); }
    // afternoon focus nudge, skipped today if you already focused
    if (N.focus && (focusTxt || course) && !(k === 0 && rangeStats(t,t).focus > 0)) push(d, '17:00', P.focusT, fill(pickL(P.focusNudge, d), {x: focusTxt || course}), 'focus');
    // evening check-in: today's is built from what is still missing
    let eb;
    if (k === 0){
      const parts = [], r = S.deen[t] || {}, pn = PR.filter(p => r[p[0]]).length, hl = S.habits.filter(h => !h.log[t]).length;
      if (hl) parts.push(fill(P.eHab, {n: hl}));
      if (pn < 5) parts.push(fill(P.ePr, {n: pn}));
      if (quits.some(q => !q.clean[t] && !q.slips.some(s => s.date === t))) parts.push(P.eQuit);
      if (!(S.journal[t] && S.journal[t].mood)) parts.push(P.eMood);
      eb = parts.length ? parts.join(' · ') : pickL(P.eDone, d);
      if (N.money){ const sp = safePerDay(); if (sp !== null && sp < 0) eb += '\n' + P.eMoneyOver; }
    } else eb = pickL(P.eGen, d);
    push(d, N.evening, P.eT, eb, quits.length ? 'quit' : 'home');
    if (N.money && d.slice(8) === '01') push(d, '10:00', P.mT1, P.month1, 'money');
  }
  push(addDays(t,14), N.morning, P.staleT, P.stale, 'home');
  return out.sort((a,b) => a.at - b.at);
}

function openSettings(){
  const st = S.settings, N = st.notif;
  const m = modal(`<h3>Settings</h3>
    <label>Your name</label><input id="s_name" value="${esc(st.name)}">
    <label>Currency</label><input id="s_cur" value="${esc(st.currency)}" placeholder="JOD, SAR, QAR, USD…">
    <label>Week starts on</label><select id="s_wk">${[[6,'Saturday'],[0,'Sunday'],[1,'Monday']].map(([v,l]) => `<option value="${v}" ${+st.weekStart===v?'selected':''}>${l}</option>`).join('')}</select>
    <label>Emergency fund target</label><select id="s_ef">${[3,6,9,12].map(v => `<option value="${v}" ${+st.efMonths===v?'selected':''}>${v} months of expenses</option>`).join('')}</select>
    <h3 style="margin-top:22px">Smart notifications</h3>
    ${hasBridge() ? '' : '<p class="small muted" style="margin-top:0">Notifications work in the Android app.</p>'}
    <label class="row" style="color:var(--ink);font-size:15px"><input type="checkbox" id="n_on" style="width:auto" ${N.on?'checked':''}> Turn on reminders & encouragement</label>
    <label>Language of the messages</label><select id="n_lang"><option value="ar" ${N.lang==='ar'?'selected':''}>العربية</option><option value="en" ${N.lang==='en'?'selected':''}>English</option></select>
    <div class="row"><div style="flex:1"><label>Morning message</label><input type="time" id="n_m" value="${esc(N.morning)}"></div><div style="flex:1"><label>Evening check-in</label><input type="time" id="n_e" value="${esc(N.evening)}"></div></div>
    <label class="row" style="color:var(--ink);font-size:14px"><input type="checkbox" id="n_q" style="width:auto" ${N.quit?'checked':''}> Bad-habit streaks, milestones and risky-time reminders</label>
    <label class="row" style="color:var(--ink);font-size:14px"><input type="checkbox" id="n_f" style="width:auto" ${N.focus?'checked':''}> Afternoon focus nudge (5 pm)</label>
    <label class="row" style="color:var(--ink);font-size:14px"><input type="checkbox" id="n_money" style="width:auto" ${N.money?'checked':''}> Money alerts (over budget, new month)</label>
    <p class="small muted">Messages change with your progress: streak days, milestones, what you have not logged yet, and gentler words when your mood has been low. Open the app at least every two weeks to keep them coming.</p>
    ${hasBridge() ? '<button class="btn sm ghost" id="n_test">Send a test notification</button>' : ''}
    <div class="row" style="margin-top:14px"><button class="btn" id="s_save">Save</button><button class="btn ghost" onclick="closeModal()">Close</button></div>
    <h3 style="margin-top:22px">Backup</h3>
    <p class="small muted" style="margin-top:0">Everything is stored only on this device. Export a backup regularly (for example to Google Drive or Telegram Saved Messages).</p>
    <div class="row wrap"><button class="btn ghost" onclick="exportData()">Export backup</button><button class="btn ghost" onclick="importData()">Import backup</button><button class="btn ghost" onclick="exportCSV()">Transactions CSV</button></div>
    <h3 style="margin-top:22px">Danger zone</h3><button class="btn danger" id="s_reset">Erase all data</button>`);
  m.querySelector('#s_save').onclick = () => {
    st.name = m.querySelector('#s_name').value.trim(); st.currency = m.querySelector('#s_cur').value.trim() || 'JOD';
    st.weekStart = +m.querySelector('#s_wk').value; st.efMonths = +m.querySelector('#s_ef').value;
    const was = N.on;
    N.on = m.querySelector('#n_on').checked; N.lang = m.querySelector('#n_lang').value;
    N.morning = m.querySelector('#n_m').value || '08:00'; N.evening = m.querySelector('#n_e').value || '21:30';
    N.quit = m.querySelector('#n_q').checked; N.focus = m.querySelector('#n_f').checked; N.money = m.querySelector('#n_money').checked;
    save(); closeModal(); render(); toast('Saved'); syncNotifs();
    if (N.on && hasBridge() && AndroidBridge.hasNotifPermission && !AndroidBridge.hasNotifPermission()) AndroidBridge.requestNotifPermission();
    else if (N.on && !was && hasBridge()) toast('Notifications on ✓');
  };
  const tb = m.querySelector('#n_test');
  if (tb) tb.onclick = () => {
    if (AndroidBridge.hasNotifPermission && !AndroidBridge.hasNotifPermission()){ AndroidBridge.requestNotifPermission(); return; }
    const P = PH[m.querySelector('#n_lang').value] || PH.ar, q = S.quits[0];
    AndroidBridge.testNotification(P.testT, q ? fill(pickL(P.streak, today()), {n: qStreak(q), name: q.name}) : P.test);
  };
  const rb = m.querySelector('#s_reset');
  rb.onclick = () => { if (rb.dataset.sure){ S = clone(DEF); save(); closeModal(); go('home'); toast('All data erased'); } else { rb.dataset.sure = 1; rb.textContent = 'Tap again to erase everything'; } };
}
function exportData(){ shareOrDownload(JSON.stringify(S), 'life-organizer-backup-' + today() + '.json', 'application/json'); }
function importData(){
  const m = modal(`<h3>Import backup</h3><p class="small muted">Choose a backup file, or paste the backup text. This replaces the data on this device.</p>
    <input type="file" id="i_file" accept=".json,application/json,text/plain"><label>…or paste backup text</label><textarea id="i_txt"></textarea>
    <div class="row" style="margin-top:14px"><button class="btn" id="i_go">Import</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
  const apply = txt => {
    try { const d = JSON.parse(txt); if (!d || !Array.isArray(d.tx) || !d.settings) throw 0; S = normalize(d); save(); closeModal(); go('home'); toast('Backup restored'); }
    catch(e){ toast('That does not look like a Life Organizer backup'); }
  };
  m.querySelector('#i_go').onclick = () => {
    const f = m.querySelector('#i_file').files[0];
    if (f){ const r = new FileReader(); r.onload = () => apply(r.result); r.readAsText(f); }
    else apply(m.querySelector('#i_txt').value);
  };
}

const VIEWS = {home: vHome, cal: vCal, money: vMoney, books: vBooks, learn: vLearn, deen: vDeen, plan: vPlan};
render();
setTimeout(syncNotifs, 800);
</script>
</body>
</html>
